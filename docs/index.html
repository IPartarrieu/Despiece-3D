<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0F1214" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F4F2EC" media="(prefers-color-scheme: light)">
<title>Visor VIMAC</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<style>
:root{--bg:#0F1214;--panel:#171B1E;--line:#2a3035;--tx:#F3F0E8;--mut:#A9ADB0;--acc:#E58A5F;--ok:#B7B45A;--sobre:#1A0F08;--bad:#EC7068;--linea:linear-gradient(90deg,#E58A5F,#B7B45A);color-scheme:dark}   /* paleta VIMAC (la misma de la app Control de equipos) */
@media (prefers-color-scheme:light){:root{--bg:#F4F2EC;--panel:#fff;--line:#d9d5ca;--tx:#25282B;--mut:#575B5F;--acc:#A94A24;--ok:#6B6A2C;--sobre:#fff;--bad:#B3261E;color-scheme:light}}
input{accent-color:var(--acc)}
header{position:relative}header::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--linea)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,sans-serif}
#app{display:grid;grid-template-columns:1fr 380px;grid-template-rows:auto 1fr;height:100%}
header{grid-column:1/3;display:flex;gap:12px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0}
.cat{font-size:12px;color:var(--mut);margin-left:-4px}
.desp{position:relative}
#selBtn,#inicioBtn{font:inherit;cursor:pointer;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
#selBtn{border-color:var(--acc);font-weight:600}
#menu{display:none;position:absolute;top:calc(100% + 6px);left:0;z-index:20;min-width:240px;max-height:70vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px #0006;padding:4px}
#menu.on{display:block}
#menu button{display:block;width:100%;text-align:left;font:inherit;color:var(--tx);background:none;border:0;border-radius:8px;padding:8px 10px;cursor:pointer}
#menu button:hover{background:var(--bg)}#menu button.on{background:var(--acc);color:var(--sobre);font-weight:600}
#menu button:disabled{color:var(--mut);cursor:default}#menu button:disabled:hover{background:none}
#portada{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px;text-align:center}
#portada.off{display:none}
#portada h2{margin:0;font-size:32px}#portada p{margin:0;color:var(--mut)}
.cards{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.card{width:260px;padding:28px 20px;font:inherit;color:var(--tx);background:var(--panel);border:1px solid var(--line);border-radius:16px;cursor:pointer}
.card:hover{border-color:var(--acc)}.card b{display:block;font-size:20px;margin:8px 0 6px}.card span{display:block;height:56px}.card span svg{width:56px;height:56px;fill:currentColor;color:var(--acc)}.card small{color:var(--mut)}
#manual{padding:10px 14px;border-top:1px solid var(--line)}
#manual a,#manual span{display:block;text-align:center;padding:9px;border-radius:8px;font-weight:600;text-decoration:none;border:1px solid var(--acc);background:var(--acc);color:var(--sobre)}
#manual span{background:none;border-color:var(--line);color:var(--mut);font-weight:400}
#vista{position:relative;min-height:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
#barra{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
#barra label{display:flex;gap:6px;align-items:center;color:var(--mut);font-size:12px}
#tip{position:absolute;pointer-events:none;background:#000c;color:#fff;padding:2px 8px;border-radius:6px;font-size:12px;display:none}
aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:10px;background:none;border:0;color:var(--mut);cursor:pointer;font:inherit;border-bottom:2px solid transparent}
.tabs button.on{color:var(--tx);border-bottom-color:var(--acc)}
.pg{display:none;overflow:auto;padding:14px;flex:1}.pg.on{display:block}
.pg h3{margin:14px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.pg h3:first-child{margin-top:0}
select,button.b{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
select{width:100%;margin-bottom:8px}
#pzQ{width:100%;margin-bottom:8px;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.seg button{flex:1;min-width:70px;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 4px;cursor:pointer}
.seg button.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 18%,var(--bg))}
.seg small{display:block;color:var(--mut)}
dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0}dt{color:var(--mut)}dd{margin:0}
.nota{color:var(--mut);font-size:12px;margin-top:10px}
.fila{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:8px;cursor:pointer}
.fila:hover{background:var(--bg)}.fila.sel{background:color-mix(in srgb,var(--ok) 22%,var(--panel))}
.fila .ojo{border:0;background:none;color:var(--mut);cursor:pointer;font-size:15px}
.ficha{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg)}
.ficha h4{margin:0 0 6px;font-size:15px}.ficha p{margin:4px 0}.ficha b{color:var(--acc)}
.paso{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px;background:var(--bg)}
.paso .adv{color:var(--bad)}
.nav{display:flex;gap:8px;align-items:center}.nav button{flex:1;cursor:pointer}
.prog{height:4px;background:var(--line);border-radius:4px;margin:10px 0}.prog i{display:block;height:100%;background:var(--acc);border-radius:4px}
button.grande{width:100%;padding:10px;margin-bottom:10px;cursor:pointer;background:var(--acc);color:var(--sobre);border-color:var(--acc);font-weight:600}
.ley{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mut);margin-top:4px}.ley i{width:12px;height:12px;border-radius:50%;flex:none}
.ctrl{display:flex;gap:10px;align-items:center;margin-top:10px;font-size:12px;color:var(--mut)}.ctrl button{cursor:pointer}.ctrl label{display:flex;gap:6px;align-items:center}
@media (max-width:800px){
 #app{grid-template-columns:1fr;grid-template-rows:auto 52vh 1fr}
 header{grid-column:1}aside{border-left:0;border-top:1px solid var(--line)}
}
</style>
</head>
<body>
<div id="portada">
 <img src="logo.svg" alt="" width="64" height="64">
 <h1 style="margin:0;font-size:15px;letter-spacing:.2em;color:var(--acc)">VISOR VIMAC</h1>
 <h2>¿Qué equipo quieres ver?</h2>
 <div class="cards">
  <button class="card" data-cat="pesada"><span><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="6" y="50" width="38" height="9" rx="4.5"/><path d="M12 48V28H29L36 37V48Z"/><path d="M18 31h9l4 5H18z" fill="var(--panel)"/><path d="M31 33L45 12L57 33" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M52 31H62L59 41H52Z"/></svg></span><b>Maquinaria Pesada</b><small>Retroexcavadora</small></button>
  <button class="card" data-cat="menor"><span><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="8" y="14" width="36" height="17" rx="5"/><rect x="44" y="18" width="8" height="9"/><rect x="52" y="21" width="10" height="3"/><rect x="17" y="30" width="13" height="25" rx="3"/></svg></span><b>Maquinaria Menor</b><small>Esmeril, demoledor, rotomartillo, bomba, sonda y telurómetro</small></button>
  <button class="card" data-cat="oficina"><span><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="10" y="6" width="24" height="52" rx="3"/><rect x="14" y="12" width="16" height="3.5" rx="1" fill="var(--panel)"/><circle cx="22" cy="48" r="3.2" fill="var(--panel)"/><rect x="38" y="18" width="22" height="16" rx="2"/><rect x="47" y="34" width="4" height="6"/><rect x="42" y="40" width="14" height="3" rx="1.5"/></svg></span><b>Equipos de oficina</b><small>PC de torre</small></button>
 </div>
</div>
<div id="app">
 <header>
  <h1 style="display:flex;align-items:center;gap:8px"><img src="logo.svg" alt="" width="24" height="24">Visor VIMAC</h1>
  <button id="inicioBtn" title="Volver al inicio">⌂ Inicio</button>
  <span class="cat" id="catTxt"></span>
  <div class="desp"><button id="selBtn">Equipo ▾</button><div id="menu"></div></div>
 </header>
 <div id="vista">
  <canvas id="c"></canvas>
  <div id="tip"></div>
  <div id="barra">
   <label>Explosión <input id="exp" type="range" min="0" max="1.2" step="0.01" value="0"></label>
   <label><input id="corte" type="checkbox"> Corte</label>
   <label title="Mueve el plano del corte; actúa solo con «Corte» activado">Posición del corte <input id="cortePos" type="range" min="-3" max="3" step="0.1" value="0" style="width:70px" disabled></label>
   <label><input id="xray" type="checkbox"> Rayos X</label>
   <label><input id="aislar" type="checkbox"> Aislar pieza</label>
   <button class="b" id="reset">Restablecer vista</button>
  </div>
 </div>
 <aside>
  <div class="tabs"><button data-t="eq" class="on">Equipo</button><button data-t="pz">Piezas</button><button data-t="ds">Desarme</button><button data-t="fn">Funciona</button></div>
  <div class="pg on" id="eq"></div>
  <div class="pg" id="pz"><input id="pzQ" type="search" placeholder="Buscar pieza (nombre, grupo o referencia)" autocomplete="off" aria-label="Buscar entre las piezas"><div id="pzL"></div></div>
  <div class="pg" id="ds"></div>
  <div class="pg" id="fn"></div>
  <div id="manual"></div>
 </aside>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module" src="app.js"></script>
</body>
</html>
