<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Despiece 3D</title>
<style>
:root{--bg:#14171c;--panel:#1b1f26;--line:#2c323c;--tx:#e8eaee;--mut:#9aa3b0;--acc:#f5a524;--ok:#3b82f6}
@media (prefers-color-scheme:light){:root{--bg:#e9ecf1;--panel:#fff;--line:#d5dae2;--tx:#1d2330;--mut:#5b6678}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,sans-serif}
#app{display:grid;grid-template-columns:1fr 380px;grid-template-rows:auto 1fr;height:100%}
header{grid-column:1/3;display:flex;gap:12px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0}
.herr{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:4px 10px;border:1px solid var(--line);border-radius:99px;color:var(--mut);font-size:12px}
.chip.on{background:var(--acc);color:#1a1200;border-color:var(--acc);font-weight:600}
#vista{position:relative;min-height:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
#barra{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
#barra label{display:flex;gap:6px;align-items:center;color:var(--mut);font-size:12px}
#tip{position:absolute;pointer-events:none;background:#000c;color:#fff;padding:2px 8px;border-radius:6px;font-size:12px;display:none}
aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:10px;background:none;border:0;color:var(--mut);cursor:pointer;font:inherit;border-bottom:2px solid transparent}
.tabs button.on{color:var(--tx);border-bottom-color:var(--acc)}
.pg{display:none;overflow:auto;padding:14px;flex:1}.pg.on{display:block}
.pg h3{margin:14px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.pg h3:first-child{margin-top:0}
select,button.b{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
select{width:100%;margin-bottom:8px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.seg button{flex:1;min-width:70px;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 4px;cursor:pointer}
.seg button.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 18%,var(--bg))}
.seg small{display:block;color:var(--mut)}
dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0}dt{color:var(--mut)}dd{margin:0}
.nota{color:var(--mut);font-size:12px;margin-top:10px}
.fila{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:8px;cursor:pointer}
.fila:hover{background:var(--bg)}.fila.sel{background:color-mix(in srgb,var(--ok) 22%,var(--panel))}
.fila .ojo{border:0;background:none;color:var(--mut);cursor:pointer;font-size:15px}
.ficha{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg)}
.ficha h4{margin:0 0 6px;font-size:15px}.ficha p{margin:4px 0}.ficha b{color:var(--acc)}
.paso{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px;background:var(--bg)}
.paso .adv{color:#f87171}
.nav{display:flex;gap:8px;align-items:center}.nav button{flex:1;cursor:pointer}
.prog{height:4px;background:var(--line);border-radius:4px;margin:10px 0}.prog i{display:block;height:100%;background:var(--acc);border-radius:4px}
@media (max-width:800px){
 #app{grid-template-columns:1fr;grid-template-rows:auto 52vh 1fr}
 header{grid-column:1}aside{border-left:0;border-top:1px solid var(--line)}
}
</style>
</head>
<body>
<div id="app">
 <header>
  <h1>Despiece 3D</h1>
  <div class="herr">
   <span class="chip on">Esmeril angular</span>
   <span class="chip" title="Próximamente">Rotomartillo</span>
   <span class="chip" title="Próximamente">Taladro</span>
  </div>
 </header>
 <div id="vista">
  <canvas id="c"></canvas>
  <div id="tip"></div>
  <div id="barra">
   <label>Explosión <input id="exp" type="range" min="0" max="1.2" step="0.01" value="0"></label>
   <label><input id="corte" type="checkbox"> Corte</label>
   <label>Posición <input id="cortePos" type="range" min="-3" max="3" step="0.05" value="0" style="width:70px"></label>
   <label><input id="xray" type="checkbox"> Rayos X</label>
   <label><input id="aislar" type="checkbox"> Aislar pieza</label>
   <button class="b" id="reset">Restablecer vista</button>
  </div>
 </div>
 <aside>
  <div class="tabs"><button data-t="eq" class="on">Equipo</button><button data-t="pz">Piezas</button><button data-t="ds">Desarme</button></div>
  <div class="pg on" id="eq"></div>
  <div class="pg" id="pz"></div>
  <div class="pg" id="ds"></div>
 </aside>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module" src="app.js"></script>
</body>
</html>
